                    o = {
                        type: sns,
                        method: 'popup',
                        url: 'https://www.linkedin.com/sharing/share-offsite/?url=' + _url + '&title=' + _txt,
                        width: 555,
                        height: 608,
                        resize: 'no'
                    };
                    break;
                case 'facebook':
                    o = {
                        type: sns,
                        method: 'popup',
                        url: 'https://www.facebook.com/sharer/sharer.php?u=' + _url,
